<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Almarai:wght@400;700&display=swap" rel="stylesheet">
<script src="./system/ds-icon.js"></script>
<style>
body:not([data-lang="fr"]):not([data-lang="ar"]) .l-fr:not(.l-en){display:none !important}
body:not([data-lang="fr"]):not([data-lang="ar"]) .l-ar:not(.l-en){display:none !important}
body[data-lang="fr"] .l-en:not(.l-fr){display:none !important}
body[data-lang="fr"] .l-ar:not(.l-fr){display:none !important}
body[data-lang="ar"] .l-en:not(.l-ar){display:none !important}
body[data-lang="ar"] .l-fr:not(.l-ar){display:none !important}
.l-ar{font-family:'Almarai','TT Norms Pro',Inter,sans-serif;letter-spacing:0 !important}
body{padding-bottom:96px}
@media(max-width:1100px){.vf-top-links{display:none !important}}
</style>
</helmet>
<div data-nav-root style="position:sticky;top:0;z-index:60;background:rgba(248,249,250,0.85);backdrop-filter:blur(16px);border-bottom:1px solid transparent;transition:border-color .25s,box-shadow .25s;font-family:'TT Norms Pro',Inter,sans-serif">
  <div style="max-width:1320px;margin:0 auto;padding:0 32px;height:68px;display:flex;align-items:center;justify-content:space-between;gap:16px">
    <div style="display:flex;align-items:center;gap:28px;min-width:0">
      <a href="home.dc.html" style="display:flex;align-items:baseline;gap:8px;flex-shrink:0;color:#061019"><span style="font-weight:700;font-size:19px;letter-spacing:0.07em">VARIFIT</span><span style="font-size:11px;color:#6B6D72;font-weight:500;letter-spacing:0.02em">by Dential</span></a>
      <div class="vf-top-links" style="display:flex;align-items:center;gap:4px;font-size:13.5px;font-weight:500">
        <a data-audience="dentist" href="home.dc.html" style="color:#3D3E42;padding:8px 14px;border-radius:999px" style-hover="background:#EDF0F2;color:#061019"><span class="l-en">For dentists</span><span class="l-fr">Pour les dentistes</span><span class="l-ar">لأطباء الأسنان</span></a>
        <a data-audience="patient" href="patients.dc.html" style="color:#3D3E42;padding:8px 14px;border-radius:999px" style-hover="background:#EDF0F2;color:#061019"><span class="l-en">For patients</span><span class="l-fr">Pour les patients</span><span class="l-ar">للمرضى</span></a>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:8px;flex-shrink:0">
      <div style="position:relative">
        <button onClick="{{ toggleLangMenu }}" title="Language" style="border:1px solid #E1E4E8;cursor:pointer;font-family:inherit;width:38px;height:38px;border-radius:999px;background:#FFFFFF;color:#3D3E42;display:inline-flex;align-items:center;justify-content:center" style-hover="border-color:#061019;color:#061019"><ds-icon name="IconTypeGlobe" size="17"></ds-icon></button>
        <sc-if value="{{ langOpen }}" hint-placeholder-val="{{ false }}">
          <div style="position:absolute;top:calc(100% + 8px);right:0;background:#FFFFFF;border:1px solid #E8EAED;border-radius:18px;box-shadow:0 16px 40px rgba(6,16,25,0.12);padding:6px;min-width:170px;display:flex;flex-direction:column;gap:2px;z-index:80">
            <sc-for list="{{ langs }}" as="lg" hint-placeholder-count="3">
              <button onClick="{{ lg.pick }}" style="border:none;cursor:pointer;text-align:start;font-family:inherit;font-size:13.5px;font-weight:{{ lg.weight }};color:#061019;background:{{ lg.bg }};padding:10px 14px;border-radius:12px;display:flex;align-items:center;justify-content:space-between;gap:12px" style-hover="background:#F5F7F9"><span>{{ lg.label }}</span><span style="color:#0067FF;display:{{ lg.checkDisplay }}"><ds-icon name="IconTypeCheck" size="14"></ds-icon></span></button>
            </sc-for>
          </div>
        </sc-if>
      </div>
      <sc-if value="{{ isPatient }}" hint-placeholder-val="{{ false }}">
        <a href="assessment.dc.html" style="display:inline-flex;align-items:center;gap:8px;background:#0067FF;color:#FFFFFF;padding:10px 18px;border-radius:999px;font-size:13.5px;font-weight:600;white-space:nowrap" style-hover="background:#0055DD"><span class="l-en">Am I suitable?</span><span class="l-fr">Suis-je éligible ?</span><span class="l-ar">هل أنا مؤهّل؟</span><ds-icon name="IconTypeArrowRight" size="14"></ds-icon></a>
      </sc-if>
      <sc-if value="{{ isDentist }}" hint-placeholder-val="{{ true }}">
        <a href="case-review.dc.html" style="display:inline-flex;align-items:center;gap:8px;background:#0067FF;color:#FFFFFF;padding:10px 18px;border-radius:999px;font-size:13.5px;font-weight:600;white-space:nowrap" style-hover="background:#0055DD"><span class="l-en">Send a case</span><span class="l-fr">Envoyer un cas</span><span class="l-ar">أرسل حالة</span><ds-icon name="IconTypeArrowRight" size="14"></ds-icon></a>
      </sc-if>
    </div>
  </div>
</div>

<div style="position:fixed;bottom:20px;left:0;right:0;z-index:70;display:flex;justify-content:center;pointer-events:none;font-family:'TT Norms Pro',Inter,sans-serif">
  <nav data-dock style="pointer-events:auto;display:flex;align-items:center;gap:2px;background:rgba(6,16,25,0.92);backdrop-filter:blur(16px);border-radius:999px;padding:6px;box-shadow:0 20px 50px rgba(6,16,25,0.35);max-width:calc(100vw - 32px);overflow-x:auto">
    <sc-for list="{{ dockLinks }}" as="l" hint-placeholder-count="5">
      <a href="{{ l.href }}" data-dock-page="{{ l.page }}" style="color:{{ l.color }};background:{{ l.bg }};padding:10px 18px;border-radius:999px;font-size:13.5px;font-weight:500;white-space:nowrap" style-hover="color:#FFFFFF"><span class="l-en">{{ l.en }}</span><span class="l-fr">{{ l.fr }}</span><span class="l-ar">{{ l.ar }}</span></a>
    </sc-for>
  </nav>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:200},&quot;active&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;mode&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;dentist&quot;,&quot;options&quot;:[&quot;dentist&quot;,&quot;patient&quot;],&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { langOpen: false, lang: 'en' };
  componentDidMount() {
    const stored = localStorage.getItem('vf-lang') || 'en';
    const lang = (this.props.mode !== 'patient' && stored === 'ar') ? 'fr' : stored;
    document.body.dataset.lang = lang;
    this.setState({ lang });
    const aud = (this.props.mode === 'patient') ? 'patient' : 'dentist';
    const audEl = document.querySelector('[data-audience="' + aud + '"]');
    if (audEl) { audEl.style.background = '#061019'; audEl.style.color = '#FFFFFF'; }
    this._onScroll = () => {
      const root = document.querySelector('[data-nav-root]');
      if (!root) return;
      const on = window.scrollY > 8;
      root.style.borderBottomColor = on ? '#E8EAED' : 'transparent';
      root.style.boxShadow = on ? '0 8px 24px rgba(6,16,25,0.05)' : 'none';
    };
    window.addEventListener('scroll', this._onScroll, { passive: true });
    this._onScroll();
    this._onDoc = (e) => { if (this.state.langOpen && !e.target.closest('[data-nav-root]')) this.setState({ langOpen: false }); };
    document.addEventListener('click', this._onDoc);
  }
  componentWillUnmount() { window.removeEventListener('scroll', this._onScroll); document.removeEventListener('click', this._onDoc); }
  setLang(lang) { localStorage.setItem('vf-lang', lang); document.body.dataset.lang = lang; this.setState({ lang, langOpen: false }); }
  renderVals() {
    const active = this.props.active || '';
    const patient = this.props.mode === 'patient';
    const links = patient ? [
      { page: 'overview', href: 'patients.dc.html', en: 'Overview', fr: 'Aperçu', ar: 'نظرة عامة' },
      { page: 'check', href: 'assessment.dc.html', en: '2-minute check', fr: 'Test de 2 minutes', ar: 'اختبار الدقيقتين' },
    ] : [
      { page: 'home', href: 'home.dc.html', en: 'Overview', fr: 'Aperçu', ar: 'نظرة عامة' },
      { page: 'how', href: 'how-it-works.dc.html', en: 'How it works', fr: 'Comment ça marche', ar: 'كيف يعمل' },
      { page: 'aligners', href: 'aligners.dc.html', en: 'Our aligners', fr: 'Nos aligneurs', ar: 'أجهزتنا' },
      { page: 'difference', href: 'varifit.dc.html', en: 'The difference', fr: 'La différence', ar: 'الفرق' },
      { page: 'luma', href: 'luma.dc.html', en: 'Education', fr: 'Formation', ar: 'التعليم' },
    ];
    const names = { en: 'English', fr: 'Français', ar: 'العربية' };
    return {
      isPatient: patient, isDentist: !patient,
      langOpen: this.state.langOpen,
      toggleLangMenu: (e) => { e.stopPropagation(); this.setState({ langOpen: !this.state.langOpen }); },
      langs: (patient ? ['en', 'fr', 'ar'] : ['en', 'fr']).map(code => ({
        label: names[code],
        weight: code === this.state.lang ? '600' : '400',
        bg: code === this.state.lang ? '#F5F7F9' : 'transparent',
        checkDisplay: code === this.state.lang ? 'inline-flex' : 'none',
        pick: () => this.setLang(code),
      })),
      dockLinks: links.map(l => ({
        ...l,
        color: l.page === active ? '#061019' : '#B9C2C9',
        bg: l.page === active ? '#FFFFFF' : 'transparent',
      })),
    };
  }
}
</script>
</body>
</html>
